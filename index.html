<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Percobaan</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📊 Dashboard Percobaan</h1>
      <div id="status">Menghubungkan…</div>
    </header>

    <div id="note" class="note">
      Buka <b>js/config.js</b> dan isi <b>API_URL</b> dengan URL Web App dari Google Apps Script.
    </div>

    <section class="stats">
      <div class="card stat"><div class="label">Total Data</div><div class="value" id="sCount">0</div></div>
      <div class="card stat"><div class="label">Total Jumlah</div><div class="value" id="sSum">0</div></div>
      <div class="card stat"><div class="label">Jumlah Kategori</div><div class="value" id="sCat">0</div></div>
      <div class="card stat"><div class="label">Rata-rata</div><div class="value" id="sAvg">0</div></div>
    </section>

    <section class="card">
      <h2>Tambah Data</h2>
      <form id="addForm" class="row">
        <input id="fNama" placeholder="Nama" required>
        <select id="fKategori" required></select>
        <input id="fJumlah" type="number" min="0" placeholder="Jumlah" required>
        <button type="submit">+ Tambah</button>
      </form>
    </section>

    <section class="two">
      <div class="card">
        <h2>Jumlah per Kategori</h2>
        <canvas id="chart" height="240"></canvas>
      </div>
      <div class="card">
        <div class="row between">
          <h2>Data</h2>
          <div class="row">
            <input id="search" placeholder="Cari nama…">
            <select id="filter"><option value="">Semua kategori</option></select>
          </div>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Nama</th><th>Kategori</th><th>Jumlah</th><th>Tanggal</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <p id="empty" class="muted" hidden>Belum ada data.</p>
        </div>
      </div>
    </section>
  </div>

  <dialog id="editDialog">
    <form method="dialog" id="editForm" class="col">
      <h2>Ubah Data</h2>
      <input id="eNama" required>
      <select id="eKategori"></select>
      <input id="eJumlah" type="number" min="0" required>
      <div class="row end">
        <button type="button" class="ghost" id="eCancel">Batal</button>
        <button type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
